<style>
:root{--bg:#eef1f6;--surf:#fff;--ink:#17213f;--mut:#667089;--line:#dbe0ea;--pri:#17213f;--acc:#0f8b8d;--on:#fff;--done:#9aa3b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1426;--surf:#182038;--ink:#eef1fa;--mut:#9aa5c4;--line:#2a3452;--pri:#4fd1c5;--acc:#4fd1c5;--on:#0f1426;--done:#6b7494}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1426;--surf:#182038;--ink:#eef1fa;--mut:#9aa5c4;--line:#2a3452;--pri:#4fd1c5;--acc:#4fd1c5;--on:#0f1426;--done:#6b7494}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.7}
.app{max-width:560px;margin:0 auto;padding:0 16px 24px}
.hd{background:#fff;color:#17213f;margin:0 -16px 18px;padding:20px 20px 22px;border-radius:0 0 28px 28px;border-bottom:3px solid #182b57}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd .inst{display:block;height:64px;width:auto;max-width:48%;margin:0}
.nmw{display:flex;flex-direction:column;gap:5px;line-height:1.2}
.hd h1{color:#17213f;margin:0;font-size:28px;gap:10px}
.hd .en{color:#0f8b8d;margin-inline-start:0;font-size:14px;letter-spacing:.3em}
.hd .sub{color:#667089;margin:6px 0 0}
.hero{display:block;background:#151f2d;width:calc(100% + 32px);margin:0 -16px 8px;height:auto}
h1{font-size:30px;margin:12px 0 2px;display:flex;align-items:center;gap:14px}
.lg{width:78px;height:78px;flex:none}
.en{margin-inline-start:14px;font-size:17px;font-weight:500;letter-spacing:.28em;color:var(--acc)}
.sub{color:var(--mut);margin:0 0 12px;font-size:15px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.bell{display:flex;align-items:center;gap:8px;width:100%;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font:inherit;color:inherit;cursor:pointer;margin-bottom:16px;text-align:right}
.bell.on{border-color:var(--acc)}
.bell small{color:var(--mut);display:block;font-size:12px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:right;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:140px}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.tile svg{width:30px;height:30px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:15px;line-height:1.5}
.tag{display:block;color:var(--acc);font-size:13px;font-weight:500;line-height:1.5}
.tile small{color:var(--mut);font-size:13px;margin-top:auto}
.tile.wide{grid-column:1/-1;min-height:0;align-items:center;text-align:center}
.tile.wide .sp{display:flex;gap:8px;margin-top:6px;justify-content:center}
.tile.wide small{margin-top:0}
.chip{background:var(--bg);border-radius:10px;padding:2px 10px;font-size:13px;color:var(--mut)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{background:var(--surf);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;cursor:pointer;color:var(--ink);font-size:20px;flex:none}
.top h2{margin:0;font-size:19px;line-height:1.4}
.tabs{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;font:inherit;padding:9px;border-radius:10px;cursor:pointer;color:var(--mut);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--pri);color:var(--on)}
.box{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;margin-bottom:16px}
.box input,.box textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.box textarea{min-height:90px;resize:vertical}
.box .r{display:flex;gap:8px;flex-wrap:wrap}
.box .r input{flex:1;min-width:120px}
.fl{flex:1;min-width:130px;display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:500;color:var(--ink)}
@media (pointer:coarse){.fl input[type=date]:not(.has){color:transparent}.fl input[type=date]:not(.has)::-webkit-datetime-edit,.fl input[type=date]:not(.has)::-webkit-datetime-edit-fields-wrapper,.fl input[type=date]:not(.has)::-webkit-datetime-edit-text,.fl input[type=date]:not(.has)::-webkit-datetime-edit-year-field,.fl input[type=date]:not(.has)::-webkit-datetime-edit-month-field,.fl input[type=date]:not(.has)::-webkit-datetime-edit-day-field{opacity:0;color:transparent}}
@media (pointer:fine){.fl input[type=date]:not(.has):not(:focus)::-webkit-datetime-edit{opacity:0}}
.fl input{min-height:46px;border:1.5px solid var(--acc)!important;text-align:right}
.box .r .go{flex:1 1 100%;min-height:44px}
.go{background:var(--pri);color:var(--on);border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.imp{display:block;border:1px dashed var(--acc);border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-weight:500}
.imp input{position:absolute;opacity:0;width:1px;height:1px}
.hint{color:var(--mut);font-size:13px;margin:0}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.item input[type=checkbox]{width:22px;height:22px;margin-top:4px;accent-color:var(--acc);flex:none}
.item .t{flex:1}
.item .t b{display:block;font-weight:500}
.item .t span{color:var(--mut);font-size:13px}
.item.done .t b{text-decoration:line-through;color:var(--done)}
.del{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:0 4px}
.empty{text-align:center;color:var(--mut);padding:28px 8px;border:1px dashed var(--line);border-radius:14px;margin-bottom:16px}
h3{font-size:15px;margin:18px 0 8px}
.pv{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:8;padding-top:env(safe-area-inset-top,0px)}
.pv.show{display:flex}
.pvh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px}
.pv img{max-width:100%;min-height:0;object-fit:contain;margin:auto}
.pv iframe{flex:1;border:0;width:100%;background:#fff}
.pg{flex:1;min-height:0;overflow:auto;padding:8px 12px}
.pg canvas{width:100%;display:block;margin-bottom:8px;background:#fff;border:1px solid var(--line)}
.dv{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 16px;line-height:1.9}
.dv img{max-width:100%}
.dv table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto}
.dv td,.dv th{border:1px solid var(--line);padding:4px 8px}
.ic{font-size:24px;line-height:1.4}
.ft{margin-top:28px;padding:18px 0 4px;text-align:center;color:var(--mut);font-size:14px;font-weight:500;border-top:1px solid var(--line)}
.pr{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.prh{display:flex;justify-content:space-between;font-size:14px}
.pr .bar{margin:6px 0 0}
.mood{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 10px 8px;margin-bottom:14px;text-align:center}
.mood>b{font-weight:500;font-size:15px}
.mr{display:flex;justify-content:space-between;gap:4px;margin-top:6px}
.mb{flex:1;background:none;border:2px solid transparent;border-radius:14px;padding:6px 0;cursor:pointer;font:inherit;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:0}
.mb span{font-size:32px;line-height:1.3}
.mb small{font-size:12px}
.mb.on{border-color:var(--acc);background:var(--bg);color:var(--ink)}
.mm{margin:8px 2px 4px;padding:9px 12px;background:var(--bg);border-radius:12px;font-size:14px;font-weight:500;line-height:1.7}
.sy{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:14px;display:grid;gap:8px}
.r2{display:flex;gap:8px}

.dsg{margin-top:0;font-size:14px;font-weight:700;color:var(--acc)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;max-width:520px;margin:0 auto;background:var(--pri);color:var(--on);border-radius:14px;padding:12px 16px;font-weight:500;display:none;z-index:9}
.toast.show{display:block}
</style>
</head>
<body>
<div class="toast" id="toast" role="alert"></div>
<div class="pv" id="pv"></div>
<div class="app" id="app"></div>
<script>
const I=p=>'<svg viewBox="0 0 24 24">'+p+'</svg>';
const ICONS={
meet:I('<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15.5 14.2c3 0 5.5 2 5.5 5.3"/>'),
vgroup:I('<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>'),
train:I('<path d="M3 9l9-4 9 4-9 4-9-4z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5M21 9v6"/>'),
mentor:I('<path d="M4 5h16v10H9l-5 4V5z"/><path d="M8 9h8M8 12h5"/>'),
plc:I('<circle cx="12" cy="6" r="2.5"/><circle cx="5.5" cy="17" r="2.5"/><circle cx="18.5" cy="17" r="2.5"/><path d="M10.5 8.2L7 14.8M13.5 8.2L17 14.8M8 17h8"/>'),
qa:I('<path d="M12 3l8 3v6c0 4.500-3.300 7.800-8 9-4.700-1.200-8-4.500-8-9V6l8-3z"/><path d="M8.500 12l2.500 2.500 4.500-5"/>'),
files:I('<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>'),

done:I('<path d="M8 4h8v5a4 4 0 01-8 0z"/><path d="M8 6H5a3 3 0 003 4M16 6h3a3 3 0 01-3 4M12 13v4M8 20h8M10 17h4"/>'),
final:I('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>'),
other:I('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>')};
const CATS=[
{id:'meet',name:'الاجتماعات واللقاءات'},
{id:'vgroup',name:'اللقاءات الافتراضية للمجموعات'},
{id:'train',name:'البرامج التدريبية الحضورية',subs:[{id:'lead',name:'ميسر رئيسي'},{id:'co',name:'ميسر مشارك'}]},
{id:'mentor',name:'جلسات التوجيه المهني الافتراضي بين الأقران',tag:'تنفذ لقادة المدارس'},
{id:'plc',name:'مجتمعات التعلم المهني',tag:'للمدربين المركزيين'},
{id:'qa',name:'خبير ضمان الجودة'},
{id:'final',name:'التقييم الختامي'},
{id:'events',name:'أنشطة وفعاليات'},
{id:'files',name:'ملفاتي',files:true},
{id:'other',name:'مهام أخرى'},
{id:'done',name:'مُنْجَز'}];
let tasks=[],notes={},view=null,sub='lead',msg='';
try{tasks=JSON.parse(localStorage.getItem('tasks_v1')||'[]');notes=JSON.parse(localStorage.getItem('notes_v1')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('tasks_v1',JSON.stringify(tasks));localStorage.setItem('notes_v1',JSON.stringify(notes))}catch(e){}};
const $=document.getElementById('app'),G=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const td=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const MOODS=[['😄','سعيد','طاقتك الإيجابية وقود الإنجاز، فاستثمرها في أهم مهامك اليوم.'],['🙂','مرتاح','هدوؤك قوة. ابدأ بخطوة صغيرة، وستتبعها الخطوات الأخرى.'],['😐','عادي','الأيام العادية تصنع الإنجازات الكبيرة، ويكفيك أن تبدأ.'],['😔','متعب','الراحة جزء من الطريق. خذ نفَسًا، وأنجز مهمة واحدة وافخر بها.'],['😫','مضغوط','لا تحمل كل شيء دفعة واحدة. رتّب مهامك وابدأ بالأهم، وستمرّ الضغوط.']];
let mood=null;
try{const m=JSON.parse(localStorage.getItem('mood_v1')||'null');if(m&&m.d===td())mood=m.v}catch(e){}
const open=(c,s)=>tasks.filter(t=>t.cat===c&&(!s||t.sub===s)&&!t.done).length;

/* ---------- التنبيهات ---------- */
let ac=null,armed=false;
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=[660,880,1100][i];o.connect(g);g.connect(ac.destination);const t=ac.currentTime+d;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.25)})}catch(e){}}
function toast(m){const t=G('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),9000)}
function notify(m){toast(m);beep();try{if('Notification' in window&&Notification.permission==='granted')new Notification('مهامي المهنية',{body:m})}catch(e){}}
async function arm(){armed=true;beep();try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}home()}
const OFF=[[7*864e5,'بعد أسبوع'],[864e5,'غدًا'],[36e5,'بعد ساعة']];
const dueOf=t=>new Date(t.date+'T'+(t.time||'09:00')).getTime();
function check(){const now=Date.now();let ch=false;
tasks.forEach(t=>{if(t.done||!t.date)return;const due=dueOf(t);t.fired=t.fired||[];let last=-1;
OFF.forEach((o,i)=>{if(now>=due-o[0]&&now<due&&!t.fired.includes(i)){t.fired.push(i);last=i;ch=true}});
if(last>=0)notify('تذكير: «'+t.title+'» موعدها '+OFF[last][1])});
if(ch)save()}
setInterval(check,30000);
/* ---------- تصدير إلى تقويم الجوال ---------- */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const ie=x=>String(x).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function ics(l){const f=d=>d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+'T'+p2(d.getUTCHours())+p2(d.getUTCMinutes())+'00Z';
const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NASAQ//AR//','CALSCALE:GREGORIAN'];
l.forEach(t=>{const st=new Date(dueOf(t)),en=new Date(st.getTime()+36e5);
L.push('BEGIN:VEVENT','UID:'+t.id+'@nasaq','DTSTAMP:'+f(new Date()),'DTSTART:'+f(st),'DTEND:'+f(en),'SUMMARY:'+ie(t.title));
[['-P7D','موعدها بعد أسبوع'],['-P1D','موعدها غدًا'],['-PT1H','موعدها بعد ساعة']].forEach(a=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ie('تذكير: '+t.title+' '+a[1]),'TRIGGER:'+a[0],'END:VALARM'));
L.push('END:VEVENT')});
L.push('END:VCALENDAR');return L.join('\r\n')}
async function dl(list,name){const l=list.filter(t=>t.date&&!t.done);
if(!l.length){toast('لا توجد مهام غير منجزة بتاريخ لإضافتها إلى التقويم.');return}
const n=new Date(),fn=name.replace(/\.ics$/,'')+'-'+p2(n.getHours())+p2(n.getMinutes())+p2(n.getSeconds())+'.ics';
const blob=new Blob([ics(l)],{type:'text/calendar;charset=utf-8'});
try{const f=new File([blob],fn,{type:'text/calendar'});
if(!IOS&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'مهام نسق'});toast('اختر تطبيق «التقويم» لإضافة المهام وتنبيهاتها.');return}}
catch(e){if(e&&e.name==='AbortError')return}
const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6e4);
toast(IOS?'عند ظهور نافذة «Add to Calendar» اضغطها ثم اختر «إضافة الكل».':'تم تجهيز ملف التقويم. افتحه لإضافة المهام وتنبيهاتها إلى تقويم جوالك.')}

/* ---------- نسخة احتياطية ومزامنة يدوية ---------- */
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,tasks,notes,dones})],{type:'application/json'}));a.download='nasaq-backup.json';document.body.appendChild(a);a.click();a.remove();toast('تم تجهيز النسخة. أرسلها إلى جهازك الآخر ثم اضغط «استيراد» هناك.')}
function rs(f){if(!f)return;const r=new FileReader();
r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!Array.isArray(d.tasks))throw 0;let n=0;const m=new Map(tasks.map(t=>[t.id,t]));
d.tasks.forEach(t=>{const x=m.get(t.id);if(!x){tasks.push(t);n++}else if(t.done&&!x.done)x.done=true});
(d.dones||[]).forEach(e=>{if(!dones.some(x=>x.id===e.id)){dones.push({...e,files:[]});n++}});saveD();
Object.entries(d.notes||{}).forEach(([k,v])=>{const c=notes[k]||'';if(!c)notes[k]=v;else if(v&&!c.includes(v))notes[k]=c+'\n---\n'+v});
save();toast('تم الاستيراد: '+n+' مهمة جديدة.');home()}catch(x){toast('الملف غير صالح. اختر ملف النسخة الاحتياطية (json) من تطبيق نسق.')}};
r.readAsText(f)}

/* ---------- الصفحة الرئيسية ---------- */
function home(){
const tot=tasks.length,dn=tasks.filter(t=>t.done).length,p=tot?Math.round(dn/tot*100):0;
const ok='Notification' in window&&Notification.permission==='granted';
$.innerHTML=`<header class="hd"><div class="hrow"><h1><span class="nmw"><span>نَسَق</span><span class="en" lang="en" dir="ltr">NASAQ</span></span></h1><svg class="lg" viewBox="0 0 110 110" role="img" aria-label="شعار نسق"><rect width="110" height="110" rx="24" fill="#1f2d44"/><path d="M29 52C29 80 77 80 77 52" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round"/><circle cx="53" cy="36" r="7" fill="#e0be7a"/></svg></div><p class="sub">أنجزت ${dn} من ${tot} مهمة</p></header><div class="mood" role="group" aria-label="الحالة النفسية"><b>كيف تشعر اليوم؟</b><div class="mr">${MOODS.map((m,i)=>`<button class="mb ${mood===i?'on':''}" data-m="${i}" aria-pressed="${mood===i}"><span aria-hidden="true">${m[0]}</span><small>${m[1]}</small></button>`).join('')}</div>${mood!==null?`<p class="mm" role="status">${MOODS[mood][2]}</p>`:''}</div><div class="bar"><i style="width:${p}%"></i></div>
<button class="bell ${armed||ok?'on':''}" id="bl"><span>🔔</span><span>${armed||ok?'التنبيهات الصوتية مفعّلة':'تفعيل التنبيهات الصوتية والإشعارات'}<small>تنبيه قبل الموعد بأسبوع، ثم بيوم، ثم بساعة. يعمل أثناء فتح الصفحة.</small></span></button><button class="bell" id="ex"><span>📅</span><span>تصدير كل المهام إلى تقويم الجوال<small>تنبيهات حقيقية على جوالك حتى لو أُغلق التطبيق.</small></span></button><div class="grid">`+
CATS.map(c=>c.subs?`<button class="tile wide" data-c="${c.id}">${ICONS[c.id]}<b>${c.name}</b><div class="sp">${c.subs.map(s=>`<span class="chip">${s.name}: ${open(c.id,s.id)}</span>`).join('')}</div></button>`:
`<button class="tile${c.wide?' wide':''}" data-c="${c.id}">${ICONS[c.id]}<b>${c.name}</b>${c.tag?`<span class="tag">${c.tag}</span>`:''}<small>${c.files?'Images وPDF وWord وPowerPoint':c.id==='done'?dones.length+' إنجاز مسجّل':open(c.id)+' قيد التنفيذ'}</small></button>`).join('')+`</div><div class="sy"><b>المزامنة بين الأجهزة</b><p class="hint">صدّر نسخة من جهاز ثم استوردها في الجهاز الآخر، فتُدمج المهام والملاحظات دون تكرار.</p><div class="r2"><button class="go" id="bx">تصدير نسخة</button><label class="imp">استيراد نسخة<input type="file" id="bi" accept=".json,application/json"></label></div></div><footer class="ft"><div class="dsg">تصميم د. عزة حامد الغامدي</div></footer>`;
G('bl').onclick=arm;G('ex').onclick=()=>dl(tasks,'nasaq-tasks.ics');G('bx').onclick=bk;G('bi').onchange=e=>rs(e.target.files[0]);
$.querySelectorAll('.mb').forEach(x=>x.onclick=()=>{mood=+x.dataset.m;try{localStorage.setItem('mood_v1',JSON.stringify({d:td(),v:mood}))}catch(e){}home()});
$.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{view=b.dataset.c;sub='lead';msg='';view==='files'?filesView():view==='done'?doneView():list()});
}

/* ---------- استيراد Excel ---------- */
function pd(dv,tv){let d='',m='',x;
const fm=n=>{const k=Math.round((n%1)*1440);return p2(Math.floor(k/60)%24)+':'+p2(k%60)};
if(typeof dv==='number'&&dv>=1){const u=new Date(Math.floor(dv-25569)*864e5);d=u.getUTCFullYear()+'-'+p2(u.getUTCMonth()+1)+'-'+p2(u.getUTCDate());if(dv%1)m=fm(dv)}
else{const s=String(dv).trim();
if(x=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))d=x[1]+'-'+p2(x[2])+'-'+p2(x[3]);
else if(x=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/))d=x[3]+'-'+p2(x[2])+'-'+p2(x[1])}
if(!m&&tv!==''&&tv!=null){if(typeof tv==='number')m=fm(tv);else if(x=String(tv).match(/(\d{1,2}):(\d{2})/))m=p2(x[1])+':'+x[2]}
return{d,m}}
function imp(f){if(!f)return;
if(typeof XLSX==='undefined'){msg='تعذر تحميل مكتبة Excel. تحقق من الاتصال ثم أعد المحاولة.';list();return}
const r=new FileReader();
r.onload=e=>{try{
const wb=XLSX.read(e.target.result,{type:'array'});
const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
const h=(rows[0]||[]).map(String),ix=(re,d)=>{const i=h.findIndex(x=>re.test(x));return i<0?d:i};
const c={t:ix(/عنوان|برنامج|اسم/,0),d:ix(/تاريخ/,1),m:ix(/وقت|ساعة/,2)};
let n=0;
rows.slice(1).forEach(w=>{const title=String(w[c.t]||'').trim();if(!title)return;
const q=pd(w[c.d],w[c.m]);
tasks.push({id:Date.now()+n++,cat:'train',sub,title,date:q.d,time:q.m,done:false,fired:[]})});
save();msg=n?`تم استيراد ${n} برنامج من الملف.`:'لم يُعثر على صفوف بيانات في الملف.';
}catch(err){msg='تعذرت قراءة الملف. تأكد أنه بصيغة Excel (xlsx أو xls).'}
list()};
r.readAsArrayBuffer(f)}

/* ---------- صفحة القسم ---------- */
function list(){
const c=CATS.find(x=>x.id===view),s=c.subs?sub:null;
const items=tasks.filter(t=>t.cat===view&&(!s||t.sub===s)).sort((a,b)=>a.done-b.done||(a.date||'9').localeCompare(b.date||'9'));
const dn=items.filter(t=>t.done).length,pc=items.length?Math.round(dn/items.length*100):0;
$.innerHTML=`<div class="top"><button class="back" aria-label="رجوع" id="bk">→</button><h2>${c.name}${c.tag?`<span class="tag">${c.tag}</span>`:''}</h2></div>`+
(c.subs?`<div class="tabs" role="tablist">${c.subs.map(x=>`<button role="tab" aria-selected="${x.id===sub}" data-s="${x.id}">${x.name}</button>`).join('')}</div>`:'')+
`<div class="pr"><div class="prh"><span>أنجزت ${dn} من ${items.length}</span><b>${pc}%</b></div><div class="bar" role="progressbar" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100" aria-label="نسبة الإنجاز"><i style="width:${pc}%"></i></div></div><div class="box"><input id="ti" placeholder="العنوان" aria-label="العنوان"><div class="r"><label class="fl"><span>📅 التاريخ</span><input id="dt" type="date"></label><label class="fl"><span>🕘 الوقت</span><input id="tm" type="time"></label><button class="go" id="ad">إضافة</button></div></div><button class="bell" id="cal"><span>📅</span><span>إضافة مهام هذا القسم إلى تقويم الجوال<small>مع تنبيه قبل الموعد بأسبوع وبيوم وبساعة.</small></span></button>`+
(view==='train'?`<div class="box"><label class="imp">استيراد جدول البرامج من ملف Excel<input type="file" id="fx" accept=".xlsx,.xls"></label><p class="hint">الصف الأول عناوين الأعمدة: اسم البرنامج، التاريخ، الوقت. تُضاف البرامج إلى التبويب المفتوح (ميسر رئيسي أو ميسر مشارك).</p>${msg?`<p class="hint" role="status"><b>${msg}</b></p>`:''}</div>`:'')+
(items.length?items.map(t=>`<div class="item ${t.done?'done':''}"><input type="checkbox" data-k="${t.id}" ${t.done?'checked':''} aria-label="إنجاز"><div class="t"><b>${esc(t.title)}</b>${t.date?`<span>${new Date(t.date+'T00:00').toLocaleDateString('ar-SA',{day:'numeric',month:'long',year:'numeric'})}${t.time?' الساعة '+t.time:''}</span>`:''}</div><button class="del" data-d="${t.id}" aria-label="حذف">×</button></div>`).join(''):`<div class="empty">لا توجد مهام بعد. اكتب عنوانًا وأضف أول مهمة.</div>`)+
`<h3>ملاحظات</h3><div class="box"><textarea id="nt" placeholder="اكتب ملاحظاتك عن هذا القسم" aria-label="ملاحظات">${esc(notes[view]||'')}</textarea></div>`;
G('bk').onclick=()=>{view=null;home()};
$.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{sub=b.dataset.s;msg='';list()});
const add=()=>{const v=G('ti').value.trim();if(!v){G('ti').focus();return}
tasks.push({id:Date.now(),cat:view,sub:s,title:v,date:G('dt').value,time:G('tm').value,done:false,fired:[]});save();check();list()};
G('ad').onclick=add;G('cal').onclick=()=>dl(items,'nasaq-'+view+'.ics');G('ti').onkeydown=e=>{if(e.key==='Enter')add()};
G('nt').oninput=e=>{notes[view]=e.target.value;save()};
{const e=G('dt'),f=()=>e.classList.toggle('has',!!e.value);e.oninput=f;e.onchange=f}
if(G('fx'))G('fx').onchange=e=>imp(e.target.files[0]);
$.querySelectorAll('[data-k]').forEach(b=>b.onchange=()=>{tasks.find(x=>x.id==b.dataset.k).done=b.checked;save();list()});
$.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{tasks=tasks.filter(x=>x.id!=b.dataset.d);save();list()});
}
/* ---------- ملفاتي ---------- */
let db;
const idb=()=>new Promise((res,rej)=>{if(db)return res(db);try{const r=indexedDB.open('files_v1',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('f'))d.createObjectStore('f',{keyPath:'id'});if(!d.objectStoreNames.contains('a'))d.createObjectStore('a',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=(m,fn,st='f')=>idb().then(d=>new Promise((res,rej)=>{const t=d.transaction(st,m),q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
const FK=f=>{const n=f.name.toLowerCase();if((f.type||'').startsWith('image/')||/\.(png|jpe?g|gif|webp|bmp)$/.test(n))return'img';if(/\.pdf$/.test(n))return'pdf';if(/\.docx?$/.test(n))return'word';if(/\.pptx?$/.test(n))return'ppt';return''};
const FI={img:'🖼️',pdf:'📕',word:'📘',ppt:'📙'};
const sz=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function pv(f){const d=G('pv');
const show=h=>{d.innerHTML=`<div class="pvh"><b>${esc(f.name)}</b><button class="go" id="pc">إغلاق</button></div>`+h;d.classList.add('show');G('pc').onclick=()=>{d.classList.remove('show');d.innerHTML=''}};
if(f.kind==='img'){const r=new FileReader();r.onload=()=>show(`<img src="${r.result}" alt="${esc(f.name)}">`);r.readAsDataURL(f.blob)}
else if(f.kind==='pdf'){show('<div class="pg" id="pg"><p class="hint">جارٍ تحميل الملف...</p></div>');
f.blob.arrayBuffer().then(async buf=>{const h=G('pg');try{
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const doc=await pdfjsLib.getDocument({data:buf,disableFontFace:true,useSystemFonts:true}).promise;h.innerHTML='';
for(let i=1;i<=Math.min(doc.numPages,40);i++){const pg=await doc.getPage(i),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:Math.min(2.5,Math.max(1,(h.clientWidth||360)/v0.width)*1.5)}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;h.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise}
}catch(e){h.innerHTML='<p class="hint">تعذر عرض هذا الملف داخل الصفحة.</p>'}})}
else{show('<div class="pg" id="pg"><p class="hint">جارٍ تحميل الملف...</p></div>');
const h=G('pg');
if(!/\.(docx|pptx)$/i.test(f.name)){h.innerHTML='<p class="hint">المعاينة تدعم الصيغتين الحديثتين docx وpptx فقط. احفظ الملف بإحدى هاتين الصيغتين ثم استورده.</p>';return}
f.blob.arrayBuffer().then(async buf=>{try{
if(f.kind==='word'){const r=await mammoth.convertToHtml({arrayBuffer:buf});h.innerHTML='<div class="dv">'+(r.value||'<p class="hint">لا يوجد نص في الملف.</p>')+'</div>'}
else{const z=await JSZip.loadAsync(buf);
const nm=Object.keys(z.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]);
let o='<p class="hint">عرض نصي للشرائح، دون التصميم والصور.</p>';
for(let i=0;i<nm.length;i++){const x=new DOMParser().parseFromString(await z.files[nm[i]].async('string'),'application/xml');
const ps=[...x.getElementsByTagName('a:p')].map(q=>[...q.getElementsByTagName('a:t')].map(t=>t.textContent).join('')).filter(Boolean);
o+=`<div class="item" style="display:block"><b>شريحة ${i+1}</b>`+(ps.length?ps.map(t=>'<p style="margin:4px 0">'+esc(t)+'</p>').join(''):'<p class="hint">لا يوجد نص في هذه الشريحة.</p>')+'</div>'}
h.innerHTML=o}
}catch(e){h.innerHTML='<p class="hint">تعذر عرض هذا الملف داخل الصفحة.</p>'}})}}

async function filesView(m){
view='files';let fs=[],err='';
try{fs=await tx('readonly',s=>s.getAll())}catch(e){err='التخزين غير متاح في هذا المتصفح.'}
fs.sort((a,b)=>b.added-a.added);
$.innerHTML=`<div class="top"><button class="back" aria-label="رجوع" id="bk">→</button><h2>ملفاتي</h2></div>
<div class="box"><label class="imp">استيراد ملفات من الجهاز<input type="file" id="fu" multiple accept="image/*,.pdf,.doc,.docx,.ppt,.pptx"></label><p class="hint">الصيغ المدعومة: صور، PDF، Word، PowerPoint. الحد الأقصى 20 MB للملف الواحد.</p>${m||err?`<p class="hint" role="status"><b>${m||err}</b></p>`:''}</div>`+
(fs.length?fs.map(f=>`<div class="item"><span class="ic">${FI[f.kind]}</span><div class="t"><b>${esc(f.name)}</b><span>${sz(f.size)} - ${new Date(f.added).toLocaleDateString('ar-SA',{day:'numeric',month:'long'})}</span></div><button class="go" data-o="${f.id}">عرض</button><button class="del" data-fd="${f.id}" aria-label="حذف">×</button></div>`).join(''):`<div class="empty">لا توجد ملفات بعد. اضغط على زر الاستيراد واختر ملفاتك.</div>`);
G('bk').onclick=()=>{view=null;home()};
G('fu').onchange=async e=>{let ok=0,bad=[];
for(const f of e.target.files){const k=FK(f);if(!k||f.size>20971520){bad.push(f.name);continue}
try{await tx('readwrite',s=>s.put({id:Date.now()+ok,name:f.name,kind:k,size:f.size,added:Date.now(),blob:f}));ok++}catch(x){bad.push(f.name)}}
filesView(`تم استيراد ${ok} ملف.`+(bad.length?` لم يُستورد: ${bad.join('، ')} (صيغة غير مدعومة أو حجم أكبر من 20 MB).`:''))};
$.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>pv(fs.find(x=>x.id==b.dataset.o)));
$.querySelectorAll('[data-fd]').forEach(b=>b.onclick=async()=>{try{await tx('readwrite',s=>s.delete(Number(b.dataset.fd)))}catch(e){}filesView()});
}
/* ---------- مُنْجَز ---------- */
let dones=[],pend=[];
try{dones=JSON.parse(localStorage.getItem('done_v1')||'[]')}catch(e){}
const saveD=()=>{try{localStorage.setItem('done_v1',JSON.stringify(dones))}catch(e){}};
const fmtD=d=>new Date(d+'T00:00').toLocaleDateString('ar-SA',{day:'numeric',month:'long',year:'numeric'});
function doneView(m){view='done';
const items=[...dones].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id-a.id);
$.innerHTML=`<div class="top"><button class="back" aria-label="رجوع" id="bk">→</button><h2>مُنْجَز</h2></div>
<div class="box"><input id="ti" placeholder="العنوان" aria-label="العنوان">
<label class="fl"><span>📅 التاريخ</span><input id="dt" type="date"></label>
<label class="imp">📎 إرفاق ملف<input type="file" id="af" multiple accept="image/*,.pdf,.doc,.docx,.ppt,.pptx"></label>
<p class="hint" id="pl">${pend.length?'المرفقات: '+esc(pend.map(f=>f.name).join('، ')):'الصيغ: Images، PDF، Word، PowerPoint (حتى 20 MB للملف).'}</p>
<textarea id="nt" placeholder="الملاحظات" aria-label="الملاحظات"></textarea>
<button class="go" id="ad">إضافة</button>${m?`<p class="hint" role="status"><b>${m}</b></p>`:''}</div>`+
(items.length?items.map(e=>`<div class="item" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><b style="font-weight:700">${esc(e.title)}</b><button class="del" data-dd="${e.id}" aria-label="حذف">×</button></div>${e.date?`<span class="hint">${fmtD(e.date)}</span>`:''}${e.notes?`<p style="margin:6px 0 0;white-space:pre-wrap">${esc(e.notes)}</p>`:''}${e.files&&e.files.length?`<div class="chips">${e.files.map(f=>`<button class="chip fb" data-fa="${f.id}">${FI[f.kind]} ${esc(f.name)}</button>`).join('')}</div>`:''}</div>`).join(''):'<div class="empty">لا توجد إنجازات مسجّلة بعد. أضف أول إنجاز.</div>');
G('bk').onclick=()=>{view=null;pend=[];home()};
{const e=G('dt'),f=()=>e.classList.toggle('has',!!e.value);e.oninput=f;e.onchange=f}
G('af').onchange=e=>{const ok=[...e.target.files].filter(f=>FK(f)&&f.size<=20971520);pend=pend.concat(ok);e.target.value='';G('pl').textContent=pend.length?'المرفقات: '+pend.map(f=>f.name).join('، '):'تعذر إرفاق الملف: الصيغة غير مدعومة أو الحجم أكبر من 20 MB.'};
const add=async()=>{const v=G('ti').value.trim();if(!v){G('ti').focus();return}
const id=Date.now(),files=[];let k=0;
for(const f of pend){const fid=id+(++k);try{await tx('readwrite',s=>s.put({id:fid,name:f.name,kind:FK(f),size:f.size,blob:f}),'a');files.push({id:fid,name:f.name,kind:FK(f),size:f.size})}catch(x){}}
dones.push({id,title:v,date:G('dt').value,notes:G('nt').value.trim(),files});saveD();pend=[];doneView('تمت إضافة الإنجاز.')};
G('ad').onclick=add;G('ti').onkeydown=e=>{if(e.key==='Enter')add()};
$.querySelectorAll('[data-fa]').forEach(b=>b.onclick=async()=>{try{const r=await tx('readonly',s=>s.get(Number(b.dataset.fa)),'a');if(r)pv(r)}catch(e){toast('تعذر فتح المرفق.')}});
$.querySelectorAll('[data-dd]').forEach(b=>b.onclick=async()=>{const e=dones.find(x=>x.id==b.dataset.dd);
for(const f of (e&&e.files)||[]){try{await tx('readwrite',s=>s.delete(f.id),'a')}catch(x){}}
dones=dones.filter(x=>x.id!=b.dataset.dd);saveD();doneView()});
}

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
home();check();
</script>
</body>
</html>
